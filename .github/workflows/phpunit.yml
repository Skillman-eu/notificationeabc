name: PHP compatibility

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  phpunit:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pgsql, intl, mbstring, soap, zip, gd, sodium
          ini-values: max_input_vars=5000, error_reporting=E_ALL
          coverage: none
      - name: Prepare Moodle plugin CI
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "$PWD/ci/bin" >> "$GITHUB_PATH"
          echo "$PWD/ci/vendor/bin" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> "$GITHUB_ENV"
      - name: Install Moodle and test database
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: pgsql
          MOODLE_BRANCH: MOODLE_405_STABLE
      - name: PHP syntax
        run: moodle-plugin-ci phplint
      - name: PHPUnit
        run: moodle-plugin-ci phpunit --fail-on-warning
